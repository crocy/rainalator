services:
  db:
    image: postgis/postgis:16-3.4
    container_name: rainalator-db
    environment:
      POSTGRES_DB: rainalator
      POSTGRES_USER: rainalator
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rainalator}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rainalator"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: backend
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: rainalator-backend
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/rainalator
      QUARKUS_DATASOURCE_USERNAME: rainalator
      QUARKUS_DATASOURCE_PASSWORD: ${DB_PASSWORD:-rainalator}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/q/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: frontend
    container_name: rainalator-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
