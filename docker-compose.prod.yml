# Production compose: db + backend only.
# Frontend ships to S3 + CloudFront via infra/deploy-frontend.sh.
#
# Required .env vars (written by EC2 user-data):
#   DB_PASSWORD, AWS_REGION, RAINALATOR_S3_BUCKET

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: rainalator-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: rainalator
      POSTGRES_USER: rainalator
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No host port publish — DB is reachable from backend container only.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rainalator"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: backend
      dockerfile: src/main/docker/Dockerfile.jvm-prod
    container_name: rainalator-backend
    restart: unless-stopped
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/rainalator
      QUARKUS_DATASOURCE_USERNAME: rainalator
      QUARKUS_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      AWS_REGION: ${AWS_REGION}
      RAINALATOR_S3_BUCKET: ${RAINALATOR_S3_BUCKET}
      # Absolute paths avoid any working-dir ambiguity inside the runtime image.
      RAINALATOR_SPILL_DIR: /var/rainalator/spill
      RAINALATOR_RAW_ARCHIVE_DIR: /var/rainalator/raw-archive
    volumes:
      - backend_spill:/var/rainalator/spill
      - backend_archive:/var/rainalator/raw-archive
    ports:
      # Published on the host so CloudFront can reach it via the EIP.
      # Security group restricts source IPs to CloudFront's prefix list.
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/q/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  pgdata:
  backend_spill:
  backend_archive:
