# Datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/rainalator
quarkus.datasource.username=rainalator
quarkus.datasource.password=${DB_PASSWORD:rainalator}
quarkus.datasource.jdbc.max-size=8

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# Rainalator config
rainalator.arso-url=https://meteo.arso.gov.si/uploads/probase/www/observ/radar/si0-rrg.srd
rainalator.fetch-interval-minutes=5

# Health
quarkus.health.extensions.enabled=true

# Jackson
quarkus.jackson.serialization-inclusion=non-null
