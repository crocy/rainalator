# Datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/rainalator
quarkus.datasource.username=rainalator
quarkus.datasource.password=${DB_PASSWORD:rainalator}
quarkus.datasource.jdbc.max-size=8

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# Rainalator config
rainalator.arso-url=https://meteo.arso.gov.si/uploads/probase/www/observ/radar/si0-rrg.srd
rainalator.fetch-interval=5m
rainalator.spill-dir=data/spill
rainalator.raw-archive-dir=data/raw-archive
rainalator.s3-bucket=rainalator-raw-archive
rainalator.s3-prefix=srd3/

# S3
quarkus.s3.endpoint-override=${S3_ENDPOINT:}
quarkus.s3.aws.region=${AWS_REGION:eu-central-1}
quarkus.s3.aws.credentials.type=default
quarkus.s3.path-style-access=true

# Health
quarkus.smallrye-health.root-path=/q/health

# Logging
quarkus.log.console.darken=1

# Jackson
quarkus.jackson.serialization-inclusion=non-null
